[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "saleslist"
version = "0.1.0"
description = "Export Instagram and X followers to a CSV file."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "instagrapi>=2.1.3",
  "python-dotenv>=1.0.1",
  "tweetkit-x==0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
saleslist = "saleslist.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["saleslist*"]
